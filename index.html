<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>История России: квиз</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#eef1f6;--fg:#14233b;--mut:#4a5870;--card:#fff;--bd:#c5cee0;--acc:#1b4bd1;--accfg:#fff;--ok:#1d6b32;--okbg:#ddf1e2;--bad:#a8281c;--badbg:#fbe3df;--mark:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1624;--fg:#e6ecf7;--mut:#a5b2c7;--card:#172236;--bd:#31405c;--acc:#8fb0ff;--accfg:#0e1624;--ok:#6fcf8c;--okbg:#1b3a27;--bad:#ff8f80;--badbg:#4a2420;--mark:#ff8f80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1624;--fg:#e6ecf7;--mut:#a5b2c7;--card:#172236;--bd:#31405c;--acc:#8fb0ff;--accfg:#0e1624;--ok:#6fcf8c;--okbg:#1b3a27;--bad:#ff8f80;--badbg:#4a2420;--mark:#ff8f80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px;font-size:15px}
#prog{color:var(--mut);font-size:15px}
.track{height:4px;background:var(--bd);border-radius:2px;margin:6px 0 20px}
#bar{height:100%;width:0;background:var(--acc);border-radius:2px;transition:width .3s}
.qcard{background:var(--card);border-left:3px solid var(--mark);border-radius:2px 8px 8px 2px;padding:18px 18px 18px 20px;margin-bottom:16px}
h2{font:600 21px/1.4 Georgia,"Times New Roman",serif;margin:0}
#opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;padding:13px 14px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.7}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok::before{content:"✓ ";font-weight:700}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad::before{content:"✗ ";font-weight:700}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#fb{min-height:1.5em;margin:14px 0 8px;font-weight:600}
.primary{font:inherit;font-weight:600;background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:12px 22px;cursor:pointer}
.primary:hover{filter:brightness(1.1)}
.primary:active{transform:scale(.98)}
[hidden]{display:none!important}
.field{display:block;margin:0 0 14px}
.field span{display:block;margin-bottom:4px;font-weight:600}
input{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg)}
input:hover{border-color:var(--acc)}
input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);min-height:1.5em;margin:0 0 10px;font-weight:600}
.note{color:var(--mut);font-size:15px;margin:0 0 16px}
.who{font:600 19px/1.3 Georgia,"Times New Roman",serif;margin:0 0 10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.ghost{font:inherit;font-weight:600;background:none;color:var(--fg);border:1.5px solid var(--bd);border-radius:8px;padding:12px 22px;cursor:pointer}
.ghost:hover{border-color:var(--acc)}
.ghost:active{transform:scale(.98)}
#score{margin:0 0 8px}
#review{margin-top:12px}
.row{background:var(--card);border-left:3px solid var(--bd);border-radius:2px 8px 8px 2px;padding:12px 14px;margin-bottom:10px}
.row.ok{border-left-color:var(--ok)}
.row.bad{border-left-color:var(--bad)}
.row b{display:block;font-weight:600}
.row span{display:block;margin-top:4px}
.row .good{color:var(--mut)}
.sw{display:flex;align-items:center;margin:0 0 12px;font-weight:600}
.sw input{width:20px;height:20px;padding:0;margin:0 10px 0 0;accent-color:var(--acc)}
.tw{overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:16px}
th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--mut)}
td .ghost{padding:6px 12px;margin:0 6px 6px 0}
td .row{background:var(--bg);margin:0 0 8px}
h3{font:600 18px/1.3 Georgia,"Times New Roman",serif;margin:24px 0 10px}
#cprog{color:var(--mut);font-size:15px}
.card{display:flex;flex-direction:column;justify-content:center;gap:10px;width:100%;min-height:220px;padding:24px;margin:12px 0 8px;font:inherit;text-align:left;color:var(--fg);background:var(--card);border:1.5px solid var(--bd);border-left:3px solid var(--mark);border-radius:2px 8px 8px 2px;cursor:pointer}
.card:hover{border-color:var(--acc);border-left-color:var(--mark)}
.card .lbl{color:var(--mut);font-size:15px}
.card .txt{font:600 22px/1.4 Georgia,"Times New Roman",serif}
.card.back,.card.back:hover{background:var(--okbg);border-color:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1 id="h1">Контрольная работа по истории России</h1>
<p class="sub">Квиз (одна попытка) и карточки для повторения. Вопросы и ответы идут в случайном порядке.</p>
<p><button id="admbtn" class="ghost">Админка</button></p>
<section id="gate">
<form id="gform" novalidate>
<label class="field"><span>Имя</span><input id="fn" autocomplete="given-name" maxlength="40"></label>
<label class="field"><span>Фамилия</span><input id="ln" autocomplete="family-name" maxlength="40"></label>
<p id="gerr" class="err" role="alert"></p>
<div class="btns"><button class="primary" type="submit">Пройти квиз</button><button type="button" id="cardsbtn" class="ghost">Учить карточками</button></div>
</form>
<p id="gwarn" class="note" hidden></p>
</section>
<section id="confirm" hidden>
<p class="note">Проверьте данные. После старта пройти квиз повторно нельзя.</p>
<p id="who" class="who"></p>
<div class="btns"><button id="go" class="primary">Начать квиз</button><button id="fix" class="ghost">Исправить</button></div>
</section>
<section id="cards" hidden>
<div id="cprog"></div>
<button id="card" class="card" aria-live="polite"><span id="clbl" class="lbl"></span><span id="ctxt" class="txt"></span></button>
<p class="note">Нажмите на карточку, чтобы перевернуть её.</p>
<div class="btns"><button id="cprev" class="ghost">Назад</button><button id="cnext" class="primary">Дальше</button><button id="cshuf" class="ghost">Перемешать</button><button id="cexit" class="ghost">Выйти</button></div>
</section>
<section id="lock" hidden>
<h2 id="lt">Вход в админку</h2>
<form id="lform" novalidate>
<label class="field"><span>Пароль</span><input id="lp" type="password" autocomplete="current-password"></label>
<p id="lerr" class="err" role="alert"></p>
<div class="btns"><button class="primary" type="submit">Войти</button><button type="button" id="lcancel" class="ghost">Назад</button></div>
</form>
</section>
<section id="admin" hidden>
<h2>Админка</h2>
<label class="sw"><input type="checkbox" id="open"><span>Квиз открыт для прохождения</span></label>
<label class="sw"><input type="checkbox" id="cardson"><span>Карточки доступны участникам</span></label>
<label class="sw"><input type="checkbox" id="builtin"><span>Использовать встроенные вопросы по истории</span></label>
<p id="astat" class="note" role="status"></p>
<h3>Работа</h3>
<label class="field"><span>Название работы</span><input id="wt" maxlength="80"></label>
<button id="wsave" type="button" class="ghost">Сохранить название</button>
<h3>Вопросы</h3>
<p id="qcount" class="note"></p>
<form id="qform" novalidate>
<label class="field"><span>Вопрос</span><input id="nq" maxlength="300"></label>
<label class="field"><span>Верный ответ</span><input id="na" maxlength="200"></label>
<label class="field"><span>Неверный ответ 1</span><input id="nw1" maxlength="200"></label>
<label class="field"><span>Неверный ответ 2 (необязательно)</span><input id="nw2" maxlength="200"></label>
<label class="field"><span>Неверный ответ 3 (необязательно)</span><input id="nw3" maxlength="200"></label>
<p id="qerr" class="err" role="alert"></p>
<button class="primary" type="submit">Добавить вопрос</button>
</form>
<div id="qlist"></div>
<h3>Результаты</h3>
<div id="alist"></div>
<button id="aclose" class="ghost">Закрыть админку</button>
</section>
<section id="quiz" hidden>
<div id="prog"></div>
<div class="track"><div id="bar"></div></div>
<div class="qcard"><h2 id="q"></h2></div>
<div id="opts"></div>
<p id="fb" aria-live="polite"></p>
<button id="next" class="primary" hidden>Далее</button>
</section>
<section id="result" hidden>
<p id="rwho" class="who"></p>
<h2 id="score"></h2>
<p id="rnote" class="note" hidden></p>
<div id="review"></div>
</section>
</main>
<script>
// Каждая запись: вопрос, верный ответ, затем неверные варианты.
const Q=[
["Какие из перечисленных материалов относятся к историческим источникам?","Летописи, археологические находки и устные предания","Только летописи и государственные документы","Только сохранившиеся здания","Только современные учебники истории"],
["Почему исторические источники нельзя считать абсолютно объективным отражением прошлого?","На их содержание влияли взгляды и интересы автора","Они всегда создавались спустя несколько столетий","Они не содержат сведений о реальных событиях","Они создавались исключительно для будущих историков"],
["Какой метод позволяет историку наиболее надёжно проверить достоверность исторического источника?","Сравнение источника с другими независимыми свидетельствами","Изучение только внешнего вида документа","Принятие авторского описания за истину","Определение возраста документа без анализа содержания"],
["Какой фактор сыграл важную роль в формировании единого Древнерусского государства?","Развитие торговых путей и необходимость политического объединения","Отказ восточных славян от торговли","Полное исчезновение племенных различий","Создание единой армии иностранными государствами"],
["Кем была княгиня Ольга в истории Древней Руси?","Правительницей Киевской Руси при малолетнем сыне Святославе","Женой князя Владимира, крестившего Русь","Первой женщиной, ставшей русской царицей","Дочерью князя Ярослава Мудрого"],
["Что, согласно легенде, князь Олег прибил к воротам Царьграда?","Свой щит","Меч","Княжеский флаг","Подкову"],
["Как княгиня Ольга, согласно летописному преданию, отомстила древлянам за убийство своего мужа Игоря?","Наказала древлянских послов и сожгла Искоростень","Заключила с ними военный союз","Отказалась от княжеской власти","Передала древлянам управление Киевом"],
["В каком году и при каком князе произошло Крещение Руси?","988 год, князь Владимир","882 год, князь Олег","945 год, князь Игорь","1019 год, Ярослав Мудрый"],
["Какое наиболее значимое последствие имело принятие христианства при князе Владимире в 988 году?","Укрепление международных связей и культурного единства государства","Немедленное прекращение всех междоусобных конфликтов","Полное прекращение влияния Византии","Ликвидация княжеской власти и создание республики"],
["В каком городе погиб царевич Дмитрий в 1591 году?","Углич","Ярославль","Тверь","Кострома"],
["В каком году пресеклась московская царская линия Рюриковичей и кто был её последним представителем на престоле?","1598 год, Фёдор Иоаннович","1584 год, Иван IV Грозный","1605 год, Борис Годунов","1613 год, Михаил Романов"],
["Кто был избран царём в 1598 году после смерти Фёдора Иоанновича?","Борис Годунов","Василий Шуйский","Владислав Сигизмундович","Михаил Романов"],
["Сколько основных самозванцев, известных как Лжедмитрии, появилось в Смутное время?","Три","Два","Пять","Семь"],
["Почему самозванцам в Смутное время удавалось находить поддержку среди населения?","Недовольство властью, голод и вера в спасение царевича Дмитрия способствовали поддержке самозванцев","Все самозванцы действительно были потомками Ивана Грозного","Население полностью поддерживало действующую власть","Самозванцы никогда не пользовались поддержкой населения"],
["Какой самозванец был убит в Москве в 1606 году?","Лжедмитрий I","Лжедмитрий II (Тушинский вор)","Иван Болотников","Лжедмитрий III"],
["Почему Смутное время начала XVII века представляло собой системный кризис российского государства?","Совпали династический, социально-экономический и политический кризисы, а также иностранная интервенция","Кризис ограничивался исключительно борьбой за престол","Главной причиной стало исключительно распространение новых религиозных идей","Кризис возник только из-за внешнего нападения на Россию"],
["Что такое «Семибоярщина»?","Правительство из семи бояр, пришедшее к власти в 1610 году","Союз семи русских княжеств против Польши","Военный союз семи иностранных государств","Народное ополчение, защищавшее Москву"],
["Почему приглашение польского королевича Владислава на русский престол вызвало недовольство значительной части населения?","Возникла угроза потери самостоятельности государства, а в Москве находились польские войска","Владислав отказался от всех прав на престол","Он собирался перенести столицу в Новгород","Он запретил торговлю с европейскими странами"],
["Кто возглавил Второе народное ополчение?","Кузьма Минин и Дмитрий Пожарский","Иван Болотников и Фёдор Мстиславский","Прокопий Ляпунов и Иван Заруцкий","Михаил Скопин-Шуйский и Василий Голицын"],
["В каком году Второе народное ополчение освободило Москву от польско-литовского гарнизона?","1612 год","1605 год","1610 год","1613 год"]
];
const $=id=>document.getElementById(id);
// Fisher-Yates: новый порядок при каждом вызове.
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ids=['gate','confirm','quiz','result','admin','cards','lock'];
const view=n=>ids.forEach(x=>{$(x).hidden=x!==n});
const norm=s=>s.trim().replace(/\s+/g,' ').toLowerCase().replace(/ё/g,'е');
const NAME=/^[A-Za-zА-Яа-яЁё]{2,}(?:[-' ’][A-Za-zА-Яа-яЁё]+)*$/;
const lockKey=p=>'quiz-attempt:'+wkey()+':'+norm(p.fn)+'|'+norm(p.ln);
const store={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
let deck,i,score,log,who;
let db=null,uid=null,admin=false,unlocked=false,cfg={},custom=[],chain=Promise.resolve();
// Проверка пароля админки прямо в файле: хранится только соль и хеш SHA-256.
const PW_SALT='48f02374865e7b43',PW_HASH='378d3d60d3e9c3cc420ff8e14df724d5581adb76d5dec4478dfb9ea76911d3cd';
// Работа = название, которое задаёт админ; у каждой работы своя попытка и свои результаты.
const DEF='Контрольная работа по истории России';
const h32=s=>{let h=5381;for(const c of s)h=(h*33^c.codePointAt(0))>>>0;return h.toString(36)};
const workTitle=()=>(cfg.work||DEF).trim();
const wkey=()=>'w'+h32(workTitle());
const setTitle=()=>{$('h1').textContent=workTitle()};
const sha=async s=>{
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
};
let cdeck=[],ci=0,flip=false;
async function loadCfg(){
  if(!db)return;
  try{const s=await db.doc('config/main').get();if(s.exists)cfg={...s.data()}}catch(e){}
  try{const s=await db.doc('config/questions').get();if(s.exists)custom=(s.data().items||[]).slice()}catch(e){}
}
// Встроенные вопросы (если не отключены) плюс свои из базы.
function pool(){
  const base=cfg.builtin===false?[]:Q;
  return base.concat(custom.map(x=>[x.q,x.a,...(x.w||[])]));
}
function cardsStart(){cdeck=shuffle(pool());ci=0;flip=false;view('cards');paint()}
function paint(){
  const c=cdeck[ci];
  $('cprog').textContent='Карточка '+(ci+1)+' из '+cdeck.length;
  $('clbl').textContent=flip?'Ответ':'Вопрос';
  $('ctxt').textContent=flip?c[1]:c[0];
  $('card').classList.toggle('back',flip);
}
const step=d=>{ci=(ci+d+cdeck.length)%cdeck.length;flip=false;paint()};
// Записи в базу идут по одной, чтобы не пересекались.
function remoteSet(rec){
  chain=chain.then(async()=>{
    if(!db||!uid)return false;
    try{
      const ref=db.doc('attempts/'+uid),s=await ref.get(),o=s.exists?s.data():{};
      await ref.set({...o,uid,fn:rec.fn,ln:rec.ln,works:{...(o.works||{}),[wkey()]:{...rec,title:workTitle(),at:Date.now()}}});
      return true;
    }catch(e){return false}
  });
  return chain;
}
async function findAttempt(){
  if(db&&uid){
    try{const s=await db.doc('attempts/'+uid).get();return {rec:s.exists?(s.data().works||{})[wkey()]||null:null}}catch(e){}
  }
  return {rec:store.get(lockKey(who))};
}
const ready=(async()=>{
  try{
    const u=await claude.use('user');
    if(u){uid=await u.id();admin=await u.canEdit()}
  }catch(e){}
  try{db=await claude.use('db')}catch(e){}
  await loadCfg();
  $('cardsbtn').hidden=cfg.cards===false&&!admin;
  setTitle();
})();
function start(){
  deck=shuffle(pool()).map(r=>({q:r[0],a:r[1],o:shuffle(r.slice(1))}));
  i=0;score=0;log=[];
  view('quiz');
  show();
}
function show(){
  if(i>=deck.length)return end();
  const d=deck[i];
  $('prog').textContent='Вопрос '+(i+1)+' из '+deck.length;
  $('bar').style.width=(i/deck.length*100)+'%';
  $('q').textContent=d.q;
  $('fb').textContent='';
  $('next').hidden=true;
  const box=$('opts');box.innerHTML='';
  d.o.forEach(t=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=t;
    b.onclick=()=>pick(b,t);
    box.appendChild(b);
  });
}
function pick(b,t){
  const d=deck[i],ok=t===d.a;
  document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===d.a)x.classList.add('ok')});
  if(ok){score++}else{b.classList.add('bad')}
  log.push({q:d.q,c:t,a:d.a,ok});
  $('fb').textContent=ok?'Верно!':'Неверно. Правильный ответ отмечен галочкой.';
  $('bar').style.width=((i+1)/deck.length*100)+'%';
  $('next').textContent=i===deck.length-1?'Показать результат':'Далее';
  $('next').hidden=false;
  $('next').focus();
}
async function end(){
  const rec={fn:who.fn,ln:who.ln,title:workTitle(),done:true,score,total:deck.length,log};
  store.set(lockKey(who),rec);
  showResult(rec,false);
  if(!await remoteSet(rec)){
    $('rnote').textContent='Результат сохранён только в этом браузере: преподаватель его не увидит.';
    $('rnote').hidden=false;
  }
}
function showResult(rec,repeat){
  view('result');
  $('rwho').textContent=rec.fn+' '+rec.ln+', '+(rec.title||workTitle());
  const n=$('rnote'),r=$('review');
  r.innerHTML='';
  n.textContent='Попытка уже использована, пройти квиз повторно нельзя.';
  if(!rec.done){
    $('score').textContent='Квиз не завершён';
    n.hidden=false;
    return;
  }
  $('score').textContent='Результат: '+rec.score+' из '+rec.total;
  n.hidden=!repeat;
  renderLog(rec.log,r);
}
function renderLog(log,box){
  log.forEach((x,k)=>{
    const d=document.createElement('div');d.className='row '+(x.ok?'ok':'bad');
    const b=document.createElement('b');b.textContent=(k+1)+'. '+x.q;
    const s=document.createElement('span');s.textContent=(x.ok?'✓ ':'✗ ')+'Ваш ответ: '+x.c;
    d.append(b,s);
    if(!x.ok){const g=document.createElement('span');g.className='good';g.textContent='Верный ответ: '+x.a;d.append(g)}
    box.appendChild(d);
  });
}
$('next').onclick=()=>{i++;show()};
$('gform').onsubmit=async e=>{
  e.preventDefault();
  const fn=$('fn').value.trim().replace(/\s+/g,' '),ln=$('ln').value.trim().replace(/\s+/g,' ');
  const bad=[];
  if(!NAME.test(fn))bad.push('fn');
  if(!NAME.test(ln))bad.push('ln');
  $('fn').setAttribute('aria-invalid',bad.includes('fn'));
  $('ln').setAttribute('aria-invalid',bad.includes('ln'));
  if(bad.length){
    $('gerr').textContent='Введите имя и фамилию буквами, минимум две буквы в каждом поле.';
    $(bad[0]).focus();
    return;
  }
  $('gerr').textContent='';
  who={fn,ln};
  await ready;
  await loadCfg();
  if(cfg.open===false&&!admin){$('gerr').textContent='Квиз сейчас закрыт преподавателем.';return}
  if(!pool().length){$('gerr').textContent='В квизе пока нет вопросов.';return}
  const f=await findAttempt();
  if(f.rec){showResult(f.rec,true);return}
  $('who').textContent=fn+' '+ln;
  view('confirm');
};
$('fix').onclick=()=>view('gate');
$('go').onclick=async()=>{
  const f=await findAttempt();
  if(f.rec){showResult(f.rec,true);return}
  const rec={fn:who.fn,ln:who.ln,done:false};
  store.set(lockKey(who),rec);
  remoteSet(rec);
  start();
};
$('admbtn').onclick=openAdmin;
$('aclose').onclick=()=>{unlocked=false;view('gate')};
$('lcancel').onclick=()=>view('gate');
function openAdmin(){
  if(unlocked)return loadAdmin();
  view('lock');
  $('lerr').textContent='';$('lp').value='';
  $('lp').focus();
}
$('lform').onsubmit=async e=>{
  e.preventDefault();
  const er=$('lerr');
  try{
    if(await sha(PW_SALT+$('lp').value)!==PW_HASH){
      er.textContent='Неверный пароль.';
      $('lp').value='';$('lp').focus();
      return;
    }
    unlocked=true;
    loadAdmin();
  }catch(err){er.textContent='Не удалось проверить пароль.'}
};
$('wsave').onclick=async()=>{
  const t=$('wt').value.trim().replace(/\s+/g,' ')||DEF;
  try{
    const n={...cfg,work:t};
    await db.doc('config/main').set(n);
    cfg=n;setTitle();
    $('astat').textContent='Название сохранено. Для нового названия у каждого участника будет новая попытка.';
  }catch(e){$('astat').textContent='Не удалось сохранить название.'}
};
async function resetAttempt(x){
  const ref=db.doc('attempts/'+x.id),ws={...(x.d.works||{})};
  delete ws[x.k];
  if(x.d.works&&Object.keys(ws).length)await ref.set({...x.d,works:ws});
  else await ref.delete();
}
// Таблицы результатов: по одной на каждую работу.
function renderResults(docs,box,st){
  const by={};
  docs.forEach(({id,d})=>{
    const ws=d.works||(d.done!==undefined?{legacy:{...d,title:DEF}}:{});
    Object.entries(ws).forEach(([k,r])=>{
      const t=r.title||DEF;
      (by[t]=by[t]||[]).push({id,d,k,r,name:(r.ln||d.ln||'')+' '+(r.fn||d.fn||'')});
    });
  });
  const titles=Object.keys(by).sort();
  st.textContent=titles.length?'Работ: '+titles.length+', попыток: '+titles.reduce((n,t)=>n+by[t].length,0)+'.':'Результатов пока нет.';
  titles.forEach(t=>{
    const list=by[t].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
    const fin=list.filter(x=>x.r.done);
    const avg=fin.length?Math.round(fin.reduce((s,x)=>s+x.r.score/x.r.total,0)/fin.length*100):null;
    const h=document.createElement('h3');
    h.textContent=t+' ('+list.length+(avg===null?'':', средний результат '+avg+'%')+')';
    const wrap=document.createElement('div');wrap.className='tw';
    const tb=document.createElement('table');
    const hd=tb.createTHead().insertRow();
    ['Ученик','Баллы','Дата',''].forEach(v=>{const th=document.createElement('th');th.textContent=v;hd.appendChild(th)});
    const body=tb.createTBody();
    list.forEach(x=>{
      const tr=body.insertRow();
      const pts=x.r.done?x.r.score+' из '+x.r.total+' ('+Math.round(x.r.score/x.r.total*100)+'%)':'не завершён';
      const dt=x.r.at?new Date(x.r.at).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'';
      [x.name,pts,dt].forEach(v=>{tr.insertCell().textContent=v});
      const ac=tr.insertCell();
      const det=body.insertRow();det.hidden=true;
      const dc=det.insertCell();dc.colSpan=4;
      if(x.r.done&&x.r.log){
        const sb=document.createElement('button');sb.className='ghost';sb.textContent='Сводка';
        sb.onclick=()=>{if(!dc.firstChild)renderLog(x.r.log,dc);det.hidden=!det.hidden};
        ac.appendChild(sb);
      }
      const rb=document.createElement('button');rb.className='ghost';rb.textContent='Сбросить';
      rb.onclick=async()=>{
        rb.disabled=true;
        try{await resetAttempt(x);loadAdmin()}
        catch(e){rb.disabled=false;st.textContent='Не удалось сбросить попытку.'}
      };
      ac.appendChild(rb);
    });
    wrap.appendChild(tb);
    box.append(h,wrap);
  });
}
$('card').onclick=()=>{flip=!flip;paint()};
$('cprev').onclick=()=>step(-1);
$('cnext').onclick=()=>step(1);
$('cshuf').onclick=cardsStart;
$('cexit').onclick=()=>view('gate');
$('cardsbtn').onclick=async()=>{
  await ready;await loadCfg();
  if(cfg.cards===false&&!admin){$('gerr').textContent='Карточки сейчас недоступны.';return}
  if(!pool().length){$('gerr').textContent='Пока нет вопросов.';return}
  $('gerr').textContent='';
  cardsStart();
};
[['open','open'],['cardson','cards'],['builtin','builtin']].forEach(([id,k])=>{
  $(id).onchange=async()=>{
    const v=$(id).checked;
    try{const n={...cfg,[k]:v};await db.doc('config/main').set(n);cfg=n;$('astat').textContent='Настройка сохранена.';renderQs()}
    catch(e){$(id).checked=!v;$('astat').textContent='Не удалось сохранить настройку.'}
  };
});
async function saveQs(items){
  await db.doc('config/questions').set({items});
  custom=items;
}
function renderQs(){
  $('qcount').textContent='Своих вопросов: '+custom.length+(cfg.builtin===false?'.':', встроенных: '+Q.length+'.');
  const l=$('qlist');l.textContent='';
  custom.forEach((x,k)=>{
    const d=document.createElement('div');d.className='row';
    const b=document.createElement('b');b.textContent=x.q;
    const s=document.createElement('span');s.textContent='Верный ответ: '+x.a;
    const t=document.createElement('button');t.className='ghost';t.textContent='Удалить';
    t.onclick=async()=>{
      t.disabled=true;
      try{await saveQs(custom.filter((_,j)=>j!==k));renderQs()}
      catch(e){t.disabled=false;$('qerr').textContent='Не удалось удалить вопрос.'}
    };
    d.append(b,s,t);l.appendChild(d);
  });
}
$('qform').onsubmit=async e=>{
  e.preventDefault();
  const g=id=>$(id).value.trim().replace(/\s+/g,' ');
  const q=g('nq'),a=g('na'),w=['nw1','nw2','nw3'].map(g).filter(Boolean);
  const low=[a,...w].map(x=>x.toLowerCase());
  const er=$('qerr');
  if(!q||!a||!w.length){er.textContent='Заполните вопрос, верный ответ и хотя бы один неверный.';return}
  if(new Set(low).size<low.length){er.textContent='Варианты ответа не должны повторяться.';return}
  if(!db){er.textContent='База данных недоступна, вопрос не сохранится.';return}
  try{await saveQs(custom.concat([{q,a,w}]));$('qform').reset();er.textContent='';renderQs()}
  catch(err){er.textContent='Не удалось сохранить вопрос.'}
};
async function loadAdmin(){
  if(!unlocked)return openAdmin();
  view('admin');
  const l=$('alist'),st=$('astat');
  await loadCfg();
  $('open').checked=cfg.open!==false;
  $('cardson').checked=cfg.cards!==false;
  $('builtin').checked=cfg.builtin!==false;
  $('wt').value=workTitle();
  renderQs();
  l.textContent='';
  if(!db){st.textContent='База данных недоступна в этом окне.';return}
  st.textContent='Загрузка...';
  try{
    const q=await db.collection('attempts').get();
    renderResults(q.docs.map(s=>({id:s.id,d:s.data()})),l,st);
  }catch(e){st.textContent='Не удалось загрузить результаты.'}
}
view('gate');
if(!store.set('quiz-probe',1)){
  $('gwarn').textContent='В этом браузере нельзя сохранить отметку о попытке, поэтому ограничение здесь не сработает.';
  $('gwarn').hidden=false;
}
